<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astrana AI - Personal Assistant</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- PWA Metadata & Favicon -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d1b2a">
    <link rel="icon" type="image/jpeg" href="{% url 'astrana_icon' %}">
    <link rel="apple-touch-icon" sizes="640x640" href="{% url 'astrana_icon' %}">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: #0b132b; }
        
        /* Tipografía estilizada para el branding dorado de Astrana */
        .font-astrana { font-family: 'Cinzel', serif; letter-spacing: 0.12em; }

        /* Brillos dorados astronómicos */
        .glow-gold { box-shadow: 0 0 20px -3px rgba(212, 175, 55, 0.35); }
        .border-gold { border-color: rgba(212, 175, 55, 0.4); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b132b; }
        ::-webkit-scrollbar-thumb { background: #1c2541; border-radius: 10px; }

        .recording-pulse {
            animation: pulse-rose 1.5s infinite;
        }
        @keyframes pulse-rose {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(244, 63, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
    </style>
</head>
<body class="bg-[#0b132b] text-slate-100 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header / Barra Superior con Logo Oficial de Astrana -->
    <header class="bg-[#0b132b]/90 backdrop-blur-xl border-b border-amber-500/20 p-3.5 sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="relative">
                <!-- Logo de Astrana encuadrado con marco dorado -->
                <div class="w-11 h-11 rounded-2xl overflow-hidden border border-amber-400/50 glow-gold bg-[#0b132b] p-0.5">
                    <img src="{% url 'astrana_icon' %}" alt="Astrana Logo" class="w-full h-full object-cover rounded-[13px]">
                </div>
                <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-[#0b132b]"></span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-astrana font-bold text-amber-200 text-lg tracking-widest">ASTRANA</h1>
                    <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-950/50 text-amber-300 border border-amber-500/30 font-semibold">Core AI</span>
                </div>
                <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Asistente personal
                </p>
            </div>
        </div>

        <!-- Acciones de Alertas y Notificaciones Push -->
        <div class="flex items-center gap-2">
            <button id="probarNotifBtn" onclick="probarNotificacionPush()" 
                    class="hidden text-[11px] px-2 py-1 rounded-xl border border-amber-500/30 text-amber-200 bg-amber-950/30 hover:bg-amber-900/50 transition flex items-center gap-1"
                    title="Enviar notificación de prueba a este dispositivo">
                <i class="fa-solid fa-paper-plane text-amber-400"></i>
                <span class="hidden md:inline">Probar Alerta</span>
            </button>
            <button id="notifBtn" onclick="solicitarPermisoNotificaciones()" 
                    class="text-xs px-2.5 py-1.5 rounded-xl border border-amber-500/30 text-amber-300 bg-amber-950/40 hover:bg-amber-900/60 transition flex items-center gap-1.5" 
                    title="Estado de notificaciones de pastillas">
                <i class="fa-regular fa-bell" id="notifIcon"></i>
                <span id="notifStatusText" class="hidden sm:inline">Recordatorios</span>
            </button>
        </div>
    </header>

    <!-- Área de Chat -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Saludo inicial de Astrana con Avatar Oficial -->
        <div class="flex items-start gap-3 animate-fade-in">
            <div class="w-8 h-8 rounded-xl overflow-hidden border border-amber-400/40 shrink-0 mt-1 glow-gold bg-[#0b132b]">
                <img src="{% url 'astrana_icon' %}" alt="Astrana Avatar" class="w-full h-full object-cover">
            </div>
            <div class="bg-[#1c2541]/90 border border-slate-700/70 p-4 rounded-2xl rounded-tl-none max-w-[88%] text-sm text-slate-200 shadow-xl space-y-2">
                <p>Hola Joaco. Soy <strong class="font-astrana text-amber-300">Astrana</strong> ✨</p>
                <p class="text-slate-300 text-xs leading-relaxed">
                    Estoy lista para asistirte con insumos, tomas y trámites. Podés preguntarme con tus propias palabras o consultar tus pastillas.
                </p>
            </div>
        </div>
    </main>

    <!-- Barra de Input y Audio -->
    <footer class="bg-[#0b132b] border-t border-slate-800 p-3.5">
        
        <!-- Previsualización del audio antes de enviar -->
        <div id="audioPreviewContainer" class="hidden mb-3 p-3 bg-[#1c2541] border border-amber-500/30 rounded-2xl flex items-center justify-between glow-gold">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-rose-500/20 flex items-center justify-center text-rose-400">
                    <i class="fa-solid fa-microphone animate-pulse"></i>
                </div>
                <audio id="audioPlayback" controls class="h-8 max-w-[210px]"></audio>
            </div>
            <button onclick="cancelAudioRecord()" class="text-slate-400 hover:text-rose-400 p-2 transition">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
            {% csrf_token %}
            <input type="text" id="userInput" placeholder="Hablá con Astrana o envía un mensaje de voz..." 
                   class="flex-1 bg-[#1c2541] border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-amber-400/80 transition">

            <!-- Botón de Micrófono / Grabador -->
            <button type="button" id="micBtn" onclick="toggleAudioRecording()" 
                    class="w-12 h-12 bg-[#1c2541] hover:bg-[#25325c] text-slate-200 border border-slate-700/80 rounded-2xl flex items-center justify-center transition shrink-0" title="Grabar nota de voz">
                <i class="fa-solid fa-microphone text-base" id="micIcon"></i>
            </button>

            <!-- Botón Enviar con estilo dorado Astrana -->
            <button type="submit" id="sendBtn"
                    class="w-12 h-12 bg-gradient-to-tr from-amber-600 to-amber-400 hover:from-amber-500 hover:to-amber-300 text-slate-950 font-bold rounded-2xl flex items-center justify-center transition shadow-lg glow-gold shrink-0">
                <i class="fa-solid fa-paper-plane text-base"></i>
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const audioPreviewContainer = document.getElementById('audioPreviewContainer');
        const audioPlayback = document.getElementById('audioPlayback');
        const astranaLogoUrl = "{% url 'astrana_icon' %}";

        // Registro de Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/astrana/' })
                .then(async reg => {
                    console.log('✅ Astrana PWA lista:', reg.scope);
                    await inicializarPushNotifications(reg);
                })
                .catch(err => console.error('❌ Error SW:', err));
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let currentAudioBlob = null;

        async function toggleAudioRecording() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioPlayback.src = URL.createObjectURL(currentAudioBlob);
                        audioPreviewContainer.classList.remove('hidden');
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('bg-rose-600', 'text-white', 'recording-pulse');
                    micBtn.classList.remove('bg-[#1c2541]', 'text-slate-200');
                    micIcon.className = 'fa-solid fa-square';
                } catch (err) {
                    alert('No se pudo acceder al micrófono: ' + err.message);
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                micBtn.classList.remove('bg-rose-600', 'text-white', 'recording-pulse');
                micBtn.classList.add('bg-[#1c2541]', 'text-slate-200');
                micIcon.className = 'fa-solid fa-microphone';
            }
        }

        function cancelAudioRecord() {
            currentAudioBlob = null;
            audioPlayback.src = '';
            audioPreviewContainer.classList.add('hidden');
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();

            if (!text && !currentAudioBlob) return;

            if (currentAudioBlob) {
                appendUserAudioMessage(URL.createObjectURL(currentAudioBlob));
            } else {
                appendUserTextMessage(text);
            }

            userInput.value = '';
            const formData = new FormData();

            if (currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'voice_note.webm');
                cancelAudioRecord();
            } else {
                formData.append('message', text);
            }

            const loadingId = appendLoadingIndicator();

            try {
                const response = await fetch('/api/astrana/chat/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                    },
                    body: formData
                });

                const data = await response.json();
                removeLoadingIndicator(loadingId);

                if (data.reply) {
                    appendAstranaMessage(data.reply);
                } else {
                    appendAstranaMessage(data.error || "No pude procesar el mensaje.");
                }
            } catch (err) {
                removeLoadingIndicator(loadingId);
                appendAstranaMessage("No pude conectar con el servidor de Astrana.");
            }
        }

        function appendUserTextMessage(text) {
            const row = document.createElement('div');
            row.className = 'flex items-start justify-end gap-3';
            const bubble = document.createElement('div');
            bubble.className = 'bg-gradient-to-tr from-amber-600 to-amber-500 text-slate-950 font-medium p-3.5 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow-lg glow-gold';
            bubble.textContent = text;
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendUserAudioMessage(audioUrl) {
            const html = `
                <div class="flex items-start justify-end gap-3">
                    <div class="bg-gradient-to-tr from-amber-600 to-amber-500 p-2.5 rounded-2xl rounded-tr-none max-w-[85%] shadow-lg glow-gold">
                        <audio controls src="${audioUrl}" class="h-8 max-w-[210px]"></audio>
                    </div>
                </div>`;
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendAstranaMessage(text) {
            const row = document.createElement('div');
            row.className = 'flex items-start gap-3 animate-fade-in';
            const avatar = document.createElement('div');
            avatar.className = 'w-8 h-8 rounded-xl overflow-hidden border border-amber-400/40 shrink-0 mt-1 glow-gold bg-[#0b132b]';
            const image = document.createElement('img');
            image.src = astranaLogoUrl;
            image.alt = 'Astrana Avatar';
            image.className = 'w-full h-full object-cover';
            avatar.appendChild(image);
            const bubble = document.createElement('div');
            bubble.className = 'bg-[#1c2541]/90 border border-slate-700/70 p-3.5 rounded-2xl rounded-tl-none max-w-[85%] text-sm text-slate-200 shadow-xl leading-relaxed whitespace-pre-wrap';
            bubble.textContent = text;
            row.append(avatar, bubble);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const html = `
                <div id="${id}" class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-xl overflow-hidden border border-amber-400/40 shrink-0 mt-1 glow-gold bg-[#0b132b]">
                        <img src="{% url 'astrana_icon' %}" alt="Astrana Avatar" class="w-full h-full object-cover animate-pulse">
                    </div>
                    <div class="bg-[#1c2541] border border-slate-700/70 p-3.5 rounded-2xl rounded-tl-none text-xs text-amber-300 flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch animate-spin text-amber-400"></i>
                        <span>Astrana está procesando...</span>
                    </div>
                </div>`;
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoadingIndicator(id) {
            const elem = document.getElementById(id);
            if (elem) elem.remove();
        }

        // --- Web Push & Pastillero Helpers ---
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/\-/g, '+')
                .replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function inicializarPushNotifications(reg) {
            try {
                if (!('PushManager' in window)) return;

                const notifIcon = document.getElementById('notifIcon');
                const notifStatusText = document.getElementById('notifStatusText');
                const probarNotifBtn = document.getElementById('probarNotifBtn');

                if (Notification.permission === 'granted') {
                    if (notifIcon) notifIcon.className = 'fa-solid fa-bell text-emerald-400';
                    if (notifStatusText) notifStatusText.textContent = 'Activo';
                    if (probarNotifBtn) probarNotifBtn.classList.remove('hidden');
                    await sincronizarSuscripcion(reg);
                } else if (Notification.permission === 'denied') {
                    if (notifIcon) notifIcon.className = 'fa-solid fa-bell-slash text-rose-400';
                    if (notifStatusText) notifStatusText.textContent = 'Silenciado';
                } else {
                    if (notifIcon) notifIcon.className = 'fa-regular fa-bell text-amber-300';
                    if (notifStatusText) notifStatusText.textContent = 'Activar';
                }
            } catch (err) {
                console.error('Error inicializando push:', err);
            }
        }

        async function solicitarPermisoNotificaciones() {
            if (!('Notification' in window)) {
                alert('Tu navegador o dispositivo no soporta notificaciones Web Push.');
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                const notifIcon = document.getElementById('notifIcon');
                const notifStatusText = document.getElementById('notifStatusText');
                const probarNotifBtn = document.getElementById('probarNotifBtn');

                if (permission === 'granted') {
                    const reg = await navigator.serviceWorker.ready;
                    await sincronizarSuscripcion(reg);
                    if (notifIcon) notifIcon.className = 'fa-solid fa-bell text-emerald-400';
                    if (notifStatusText) notifStatusText.textContent = 'Activo';
                    if (probarNotifBtn) probarNotifBtn.classList.remove('hidden');
                    appendAstranaMessage('🔔 ¡Notificaciones activadas con éxito! Los recordatorios de pastillas llegarán directo a este dispositivo.');
                } else {
                    if (notifIcon) notifIcon.className = 'fa-solid fa-bell-slash text-rose-400';
                    if (notifStatusText) notifStatusText.textContent = 'Silenciado';
                }
            } catch (e) {
                console.error('Error al solicitar permiso:', e);
            }
        }

        async function sincronizarSuscripcion(reg) {
            try {
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    const res = await fetch('/api/astrana/pwa/vapid-key/');
                    const data = await res.json();
                    const claveVapid = data.public_key || data.publicKey;
                    if (!claveVapid) {
                        console.error('No se recibió clave VAPID pública.');
                        return;
                    }

                    const convertedVapidKey = urlBase64ToUint8Array(claveVapid);
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: convertedVapidKey
                    });
                }

                if (sub) {
                    await fetch('/api/astrana/pwa/subscribe/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                        },
                        body: JSON.stringify({
                            chat_id: 'principal',
                            subscription: sub.toJSON()
                        })
                    });
                    console.log('✅ Suscripción Web Push registrada en Astrana.');
                }
            } catch (err) {
                console.error('Error sincronizando suscripción push:', err);
            }
        }

        async function probarNotificacionPush() {
            try {
                const res = await fetch('/api/astrana/pwa/probar-push/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.status === 'success') {
                    appendAstranaMessage(`🚀 ${data.mensaje}`);
                } else {
                    appendAstranaMessage(`⚠️ No se pudo enviar la alerta de prueba: ${data.error || 'Error desconocido'}`);
                }
            } catch (err) {
                appendAstranaMessage('⚠️ Error enviando alerta de prueba.');
            }
        }

        async function verificarPastilleroHoy() {
            try {
                const res = await fetch('/api/astrana/pastillero/estado-hoy/');
                const data = await res.json();
                if (data.pendientes && data.pendientes.length > 0) {
                    mostrarTarjetasPastillero(data.pendientes);
                }
            } catch (err) {
                console.error('Error al consultar pastillero:', err);
            }
        }

        function mostrarTarjetasPastillero(pendientes) {
            for (const med of pendientes) {
                const cardId = `pastillero-card-${med.id}`;
                if (document.getElementById(cardId)) continue;

                const card = document.createElement('div');
                card.id = cardId;
                card.className = 'flex items-start gap-3 animate-fade-in';
                card.innerHTML = `
                    <div class="w-8 h-8 rounded-xl overflow-hidden border border-amber-400/40 shrink-0 mt-1 glow-gold bg-[#0b132b]">
                        <img src="${astranaLogoUrl}" alt="Astrana" class="w-full h-full object-cover">
                    </div>
                    <div class="bg-[#1c2541]/95 border border-amber-500/40 p-4 rounded-2xl rounded-tl-none max-w-[88%] text-sm text-slate-200 shadow-xl space-y-3 glow-gold">
                        <div class="flex items-center justify-between border-b border-amber-500/20 pb-2">
                            <span class="text-xs uppercase tracking-wider text-amber-300 font-semibold flex items-center gap-1.5">
                                <i class="fa-solid fa-pills text-amber-400"></i> Recordatorio Diario
                            </span>
                            <span class="text-[11px] text-slate-400">Hoy</span>
                        </div>
                        <p class="text-sm">
                            Tenés pendiente tomar <strong class="text-amber-200">${med.nombre}</strong>.
                            <span class="text-xs text-slate-400 block mt-0.5">Stock restante: ${med.cantidad_total} pastillas</span>
                        </p>
                        <div class="flex items-center gap-2 pt-1" id="acciones-${med.id}">
                            <button onclick="confirmarTomaMedicamento(${med.id}, '${med.nombre}')"
                                    class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-medium py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-md">
                                <i class="fa-solid fa-check"></i> Confirmar Toma
                            </button>
                        </div>
                    </div>
                `;
                chatContainer.appendChild(card);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        async function confirmarTomaMedicamento(medicamentoId, nombre) {
            const contenedorAcciones = document.getElementById(`acciones-${medicamentoId}`);
            if (contenedorAcciones) {
                contenedorAcciones.innerHTML = `
                    <div class="text-xs text-amber-300 flex items-center gap-2 py-1">
                        <i class="fa-solid fa-circle-notch animate-spin"></i> Registrando toma en base de datos...
                    </div>
                `;
            }

            try {
                const res = await fetch('/api/astrana/pastillero/confirmar/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ medicamento_id: medicamentoId })
                });
                const data = await res.json();

                if (contenedorAcciones) {
                    contenedorAcciones.innerHTML = `
                        <div class="text-xs text-emerald-400 font-medium flex items-center gap-1.5 py-1">
                            <i class="fa-solid fa-circle-check"></i> Toma registrada exitosamente
                        </div>
                    `;
                }

                if (data.status === 'success') {
                    appendAstranaMessage(`✅ ¡Excelente Joaco! Registré tu toma de ${data.medicamento || nombre}. Quedan ${data.stock} pastillas en tu pastillero.`);
                } else {
                    appendAstranaMessage(`ℹ️ ${data.message}`);
                }
            } catch (err) {
                console.error('Error al confirmar toma:', err);
                if (contenedorAcciones) {
                    contenedorAcciones.innerHTML = `
                        <button onclick="confirmarTomaMedicamento(${medicamentoId}, '${nombre}')"
                                class="text-xs bg-rose-600 text-white py-1.5 px-3 rounded-xl">
                            Reintentar
                        </button>
                    `;
                }
                appendAstranaMessage("No pude registrar la toma. Verificá tu conexión a internet.");
            }
        }

        // Consultar estado de tomas al cargar la pantalla
        document.addEventListener('DOMContentLoaded', () => {
            verificarPastilleroHoy();
        });
    </script>
</body>
</html>
